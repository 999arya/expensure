{% if field.errors %}
  <p class="field-error" id="{{ field.id_for_label }}-error">
    {% for error in field.errors %}{{ error }}{% if not forloop.last %} {% endif %}{% endfor %}
  </p>
{% endif %}
<div class="field{% if field.errors %} field--error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}
    <div class="field-help" id="{{ field.id_for_label }}-help">{{ field.help_text|safe }}</div>
  {% endif %}
</div>
